[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-interop"
version = "0.1.0"
description = "Atlas-interoperability layer for connectome learning: atlas mapping, FLECHA and MECHA"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.23",
    "scipy>=1.9",
    "pandas>=1.5",
    "scikit-learn>=1.2",
    "torch>=2.0",
    "pot>=0.9.0",
    "tqdm>=4.64",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["atlas_interop*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
